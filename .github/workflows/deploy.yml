name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    name: Apply database migrations (Neon)
    # Off until you add the production secrets and set repository variable DEPLOY_ENABLED=true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --workspace @copilot/api --include-workspace-root
      - working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npx prisma migrate deploy

  api:
    name: Deploy API + worker (Render)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Render rebuilds from the repo when the deploy hook is called (see render.yaml).
      - name: Trigger API deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_API_DEPLOY_HOOK }}"
      - name: Trigger worker deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}"

  web:
    name: Deploy web (Vercel)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g vercel@37
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
